title: Toybox Demo
subtitle: Insert a story. Press start.
description: A live showcase for Hexo Theme Toybox.
keywords: Hexo, Toybox, pixel art, theme
author: Toybox
language: zh-CN
timezone: Asia/Shanghai

url: https://dipsysu.github.io/hexo-theme-toybox
root: /hexo-theme-toybox/
permalink: posts/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 5
  order_by: -date
archive_generator:
  per_page: 10
  yearly: true
  monthly: true
category_generator:
  per_page: 10
tag_generator:
  per_page: 10

search:
  path: search.xml
  field: post
  content: true
  format: html

theme: toybox
